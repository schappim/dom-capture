<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit fixture — text editing, moving and pasting</title>
<style>
  body { margin: 0; padding: 32px; font: 15px/1.4 system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
  .list { margin: 0 0 24px; padding: 0; list-style: none; width: 260px; }
  .list li { padding: 10px 14px; margin: 0 0 6px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; }
  .card { width: 320px; padding: 20px; border-radius: 14px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; box-shadow: 0 10px 30px rgba(79, 70, 229, .35); }
  .card h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.01em; }
  .card p { margin: 0; opacity: .85; }
  .zone { margin-top: 24px; min-height: 120px; padding: 16px; border: 2px dashed #94a3b8; border-radius: 12px; color: #64748b; }
  .row { display: flex; gap: 8px; margin-top: 24px; }
  .row span { padding: 6px 12px; background: #e2e8f0; border-radius: 999px; }
  textarea { display: block; margin-top: 24px; width: 260px; }
  /* Context-dependent styling: only inside .section does the address get its padding, colour and font. */
  .section { margin-top: 24px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: Georgia, serif; color: #1d4ed8; }
  .section .address { padding: 16px; background: #eff6ff; }
  .section .address b { font-weight: 900; }
  .zone > * { border-radius: 10px; }
</style>
</head>
<body>
<ul class="list" id="list">
  <li id="a">Alpha</li>
  <li id="b">Beta</li>
  <li id="c">Gamma</li>
</ul>
<article class="card" id="card">
  <h2>Quarterly report</h2>
  <p>Revenue grew 18% while churn fell.</p>
</article>
<div class="zone" id="zone">Drop zone — things can be moved in here.</div>
<div class="row" id="row"><span id="r1">One</span><span id="r2">Two</span><span id="r3">Three</span></div>
<textarea id="ta">Some notes</textarea>
<div class="section" id="section"><div class="address" id="addr"><b>Acacia Gardens</b> — 1 Acacia Ave, Neutral Bay</div></div>
<script>
  // The page must not see any of the keys typed while editing.
  document.addEventListener('keydown', (e) => { if (e.isTrusted) window.__pageSawKey = e.key; }, true);
</script>
</body>
</html>
