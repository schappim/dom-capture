<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iframes fixture</title>
<style>
  body { margin: 0; padding: 32px; font: 15px/1.4 system-ui, sans-serif; background: #f8fafc; }
  #wrap { display: grid; gap: 12px; width: 420px; padding: 12px; border: 2px solid #334155; border-radius: 10px; background: #fff; }
  iframe { width: 100%; height: 90px; border: 1px solid #94a3b8; border-radius: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <iframe id="same" src="framed.html" title="same origin"></iframe>
  <!-- Another origin (same port, other host name): the page itself cannot look inside this one. -->
  <iframe id="cross" title="cross origin" allow="clipboard-read"></iframe>
  <iframe id="nested" title="a frame in a frame"></iframe>
</div>
<script>
  // A frame's contents must reach the extension only — never this page.
  addEventListener('message', (e) => { if (JSON.stringify(e.data ?? '').includes('Framed')) window.__leak = true; });
  const other = `http://127.0.0.1:${location.port}`;
  document.getElementById('cross').src = `${other}/framed.html`;
  document.getElementById('nested').srcdoc = `<body style="margin:0"><iframe src="${other}/framed.html" style="width:100%;height:80px;border:0"></iframe></body>`;
</script>
</body>
</html>
