<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web components fixture</title>
<style>
  :root { --accent: #db2777; --surface: #fff7ed; }
  body { margin: 0; padding: 32px; font-family: Georgia, serif; background: #fef3c7; color: #1c1917; }
  .stage { width: 420px; }
  user-card { margin-bottom: 16px; }
  user-card::part(name) { letter-spacing: .04em; text-decoration: underline wavy #db2777; }
  .bio { font-style: italic; }
  .bio b { color: #0369a1; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <user-card id="open-card" tone="warm">
    <img slot="avatar" src="pixel.svg" alt="" width="40" height="40">
    <span slot="name">Ada Lovelace</span>
    <p class="bio">Wrote the <b>first</b> program.</p>
    <p class="bio">Second paragraph in the default slot.</p>
    <span slot="nowhere">assigned to a slot that does not exist — never rendered</span>
  </user-card>

  <user-card id="empty-card"></user-card>

  <secret-box id="secret">light child of closed host</secret-box>

  <div id="plain-host"></div>
</div>

<script>
  window.__closedRoots = new WeakMap();

  // Shared constructable stylesheet, adopted by every <pill-tag>.
  const pillSheet = new CSSStyleSheet();
  pillSheet.replaceSync(`
    :host { display: inline-block; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font: 600 12px/1.6 system-ui, sans-serif;
            background: var(--accent); color: white; transition: background-color .2s; }
    .pill:hover { background: #111827; }
    .pill::before { content: "#"; opacity: .7; margin-right: 2px; }
  `);

  class PillTag extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.adoptedStyleSheets = [pillSheet];
      root.innerHTML = '<span class="pill"><slot>tag</slot></span>';
    }
  }
  customElements.define('pill-tag', PillTag);

  class UserCard extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>
          :host { display: block; border: 2px solid var(--accent); border-radius: 14px; background: var(--surface); padding: 14px; }
          :host([tone="warm"]) { box-shadow: 6px 6px 0 #fdba74; }
          .row { display: flex; align-items: center; gap: 12px; }
          .avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #e7e5e4; flex: none; }
          ::slotted(img) { display: block; width: 100%; height: 100%; object-fit: cover; }
          h3 { margin: 0; font: 700 18px/1.2 system-ui, sans-serif; color: #7c2d12; }
          ::slotted(p) { margin: 8px 0 0; color: #44403c; }
          .tags { margin-top: 10px; display: flex; gap: 6px; }
          .fallback { color: #a8a29e; }
          .row:hover h3 { color: #be123c; }
        </style>
        <div class="row">
          <div class="avatar"><slot name="avatar"></slot></div>
          <h3 part="name"><slot name="name"><span class="fallback">Anonymous</span></slot></h3>
        </div>
        <slot><p class="fallback" style="margin:8px 0 0">No bio yet.</p></slot>
        <div class="tags"><pill-tag>math</pill-tag><pill-tag></pill-tag></div>
      `;
    }
  }
  customElements.define('user-card', UserCard);

  class SecretBox extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'closed' });
      window.__closedRoots.set(this, root);
      root.innerHTML = `
        <style>
          :host { display: block; margin-bottom: 16px; }
          .vault { padding: 12px; background: #1e1b4b; color: #e0e7ff; border-radius: 8px; font: 14px/1.4 ui-monospace, monospace; }
          .vault strong { color: #fbbf24; }
        </style>
        <div class="vault"><strong>closed root:</strong> <slot></slot></div>
      `;
    }
  }
  customElements.define('secret-box', SecretBox);

  // A built-in element hosting a shadow root (no custom element involved).
  const host = document.getElementById('plain-host');
  host.attachShadow({ mode: 'open' }).innerHTML =
    '<style>p { margin: 0; padding: 8px; background: #bbf7d0; border-left: 4px solid #16a34a; }</style><p>shadow root on a plain div</p>';
</script>
</body>
</html>
